name: Targeted Windows native decoder recheck
on:
  push:
    branches: [maintenance/native-desktop-recheck]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: Native ${{ matrix.target }} build and playback
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows
    defaults:
      run:
        working-directory: clients/native
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Check Windows toolchain
        if: matrix.target == 'windows'
        run: flutter doctor -v
      - name: Generate platform runner
        run: |
          flutter create --no-pub --project-name music_flow --org com.musicflow --platforms=${{ matrix.target }} .
          python tool/bootstrap.py
          flutter pub get
          flutter analyze
      - name: Diagnose Windows audio endpoints
        shell: pwsh
        run: |
          Get-Service AudioEndpointBuilder,Audiosrv | Format-Table Name,Status,StartType
          Get-CimInstance Win32_SoundDevice | Format-List Name,Status
      - name: Native decoding and playback timing (headless audio sink)
        run: flutter test integration_test/player_test.dart -d windows --dart-define=MUSIC_FLOW_HEADLESS_AUDIO=true
      - name: Build desktop release candidate
        run: flutter build ${{ matrix.target }} --release
      - name: Install Windows installer tooling
        if: matrix.target == 'windows'
        run: choco install innosetup -y --no-progress
      - name: Package and verify checksums
        run: python tool/package.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}-v0.3.0-candidate
          path: clients/native/release-files/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lockfile-${{ matrix.target }}
          path: clients/native/pubspec.lock
          if-no-files-found: warn