name: MusicFlow Native CI
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: Native ${{ matrix.target }} build and playback
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
          - os: windows-2025
            target: windows
          - os: macos-15
            target: macos
    defaults:
      run:
        working-directory: clients/native
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Linux native dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev mpv xvfb pulseaudio
          pulseaudio --start
          pactl load-module module-null-sink sink_name=musicflow_test
          pactl set-default-sink musicflow_test
      - name: Generate platform runner
        run: |
          flutter create --no-pub --project-name music_flow --org com.musicflow --platforms=${{ matrix.target }} .
          python tool/bootstrap.py
          flutter pub get
          flutter analyze
      - name: Actual Linux playback integration
        if: matrix.target == 'linux'
        run: xvfb-run -a flutter test integration_test/player_test.dart -d linux
      - name: Actual Windows/macOS playback integration
        if: matrix.target != 'linux'
        run: flutter test integration_test/player_test.dart -d ${{ matrix.target }}
      - name: Build desktop release candidate
        run: flutter build ${{ matrix.target }} --release
      - name: Install Windows installer tooling
        if: matrix.target == 'windows'
        run: choco install innosetup -y --no-progress
      - name: Package and verify checksums
        run: python tool/package.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}-v0.3.0-candidate
          path: clients/native/release-files/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lockfile-${{ matrix.target }}
          path: clients/native/pubspec.lock
          if-no-files-found: warn
  android:
    name: Android build and emulator playback
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    defaults:
      run:
        working-directory: clients/native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: |
          flutter create --no-pub --project-name music_flow --org com.musicflow --platforms=android .
          python tool/bootstrap.py
          flutter pub get
          flutter analyze
      - name: Enable hardware acceleration for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: cd clients/native && flutter test integration_test/player_test.dart -d emulator-5554
      - run: flutter build apk --release
      - run: python tool/package.py android
      - uses: actions/upload-artifact@v4
        with:
          name: native-android-v0.3.0-test-signed
          path: clients/native/release-files/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lockfile-android
          path: clients/native/pubspec.lock
  ios:
    name: iOS simulator build and playback
    runs-on: macos-15
    timeout-minutes: 65
    defaults:
      run:
        working-directory: clients/native
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: |
          flutter create --no-pub --project-name music_flow --org com.musicflow --platforms=ios .
          python tool/bootstrap.py
          flutter pub get
          flutter analyze
      - name: Start iOS simulator
        run: |
          device=$(xcrun simctl list devices available -j | python -c 'import json,sys; data=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime,devices in data.items() if "iOS" in runtime for d in devices if d["name"].startswith("iPhone") and d.get("isAvailable",True)))')
          echo "IOS_DEVICE=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device" || xcrun simctl list devices booted
          xcrun simctl bootstatus "$device" -b
      - name: Actual iOS simulator playback
        run: flutter test integration_test/player_test.dart -d "$IOS_DEVICE"
      - run: flutter build ios --simulator --debug
      - run: python tool/package.py ios
      - uses: actions/upload-artifact@v4
        with:
          name: native-ios-v0.3.0-simulator-only
          path: clients/native/release-files/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lockfile-ios
          path: clients/native/pubspec.lock
