name: Targeted macOS and iOS native recheck
on:
  push:
    branches: [maintenance/native-apple-recheck]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: Native ${{ matrix.target }} build and playback
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos
    defaults:
      run:
        working-directory: clients/native
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Linux native dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev mpv xvfb pulseaudio
          pulseaudio --start
          pactl load-module module-null-sink sink_name=musicflow_test
          pactl set-default-sink musicflow_test
      - name: Generate platform runner
        run: |
          flutter create --no-pub --project-name music_flow --org com.musicflow --platforms=${{ matrix.target }} .
          python tool/bootstrap.py
          flutter pub get
          flutter analyze
      - name: Actual Linux playback integration
        if: matrix.target == 'linux'
        run: xvfb-run -a flutter test integration_test/player_test.dart -d linux
      - name: Actual Windows/macOS playback integration
        if: matrix.target != 'linux'
        run: flutter test integration_test/player_test.dart -d ${{ matrix.target }}
      - name: Build desktop release candidate
        run: flutter build ${{ matrix.target }} --release
      - name: Install Windows installer tooling
        if: matrix.target == 'windows'
        run: choco install innosetup -y --no-progress
      - name: Package and verify checksums
        run: python tool/package.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}-v0.3.0-candidate
          path: clients/native/release-files/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lockfile-${{ matrix.target }}
          path: clients/native/pubspec.lock
          if-no-files-found: warn
  ios:
    name: iOS simulator build and playback
    runs-on: macos-15
    timeout-minutes: 65
    defaults:
      run:
        working-directory: clients/native
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: |
          flutter create --no-pub --project-name music_flow --org com.musicflow --platforms=ios .
          python tool/bootstrap.py
          flutter pub get
          flutter analyze
      - name: Start iOS simulator
        run: |
          device=$(xcrun simctl list devices available -j | python -c 'import json,sys; data=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime,devices in data.items() if "iOS" in runtime for d in devices if d["name"].startswith("iPhone") and d.get("isAvailable",True)))')
          echo "IOS_DEVICE=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device" || xcrun simctl list devices booted
          xcrun simctl bootstatus "$device" -b
          xcrun simctl list devices booted
          xcodebuild -version
          flutter doctor -v
      - name: Actual iOS simulator playback
        run: flutter test --timeout 25m --verbose integration_test/player_test.dart -d "$IOS_DEVICE"
      - name: Capture iOS simulator diagnostic evidence
        if: always()
        run: |
          if [ -n "$IOS_DEVICE" ]; then
            mkdir -p simulator-evidence
            xcrun simctl io "$IOS_DEVICE" screenshot simulator-evidence/screen.png || true
            xcrun simctl spawn "$IOS_DEVICE" log show --last 10m --predicate 'process == "Runner"' > simulator-evidence/runner.log || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-diagnostics
          path: clients/native/simulator-evidence/
          if-no-files-found: warn
      - run: flutter build ios --simulator --debug
      - run: python tool/package.py ios
      - uses: actions/upload-artifact@v4
        with:
          name: native-ios-v0.3.0-simulator-only
          path: clients/native/release-files/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lockfile-ios
          path: clients/native/pubspec.lock
