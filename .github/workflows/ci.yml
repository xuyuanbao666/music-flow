name: MusicFlow CI
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @music-flow/api db:generate
      - run: pnpm --filter @music-flow/api test
      - run: pnpm build
      - run: pnpm lint
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/musicflow-browser" --no-save --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/musicflow-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run production web browser tests
        env:
          PLAYWRIGHT_DIR: ${{ runner.temp }}/musicflow-browser
        run: |
          pnpm --filter @music-flow/web exec vite preview --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/musicflow-preview.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/music-flow/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/music-flow/ > /dev/null
          node tests/browser-smoke.mjs
      - name: Upload actual browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: test-results/*.png
          if-no-files-found: ignore
      - name: Package verified web build
        run: |
          test -s apps/web/dist/index.html
          mkdir -p release-files
          (cd apps/web/dist && zip -qr ../../../release-files/musicflow-v0.2.0-web.zip .)
          (cd release-files && sha256sum musicflow-v0.2.0-web.zip > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: verified-web-package
          path: release-files/
          if-no-files-found: error
  publish-v020:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-web-package
          path: release-files
      - name: Publish v0.2.0 once after verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(node -p "require('./package.json').version")" = "0.2.0" || exit 0
          if gh release view v0.2.0 >/dev/null 2>&1; then
            echo "v0.2.0 already exists; not replacing release."
            exit 0
          fi
          (cd release-files && sha256sum -c SHA256SUMS.txt)
          gh release create v0.2.0 --target "$GITHUB_SHA" --title "MusicFlow v0.2.0" --notes-file docs/release-v0.2.0.md release-files/musicflow-v0.2.0-web.zip release-files/SHA256SUMS.txt
